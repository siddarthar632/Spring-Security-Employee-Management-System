<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="card wide">
<h1>Dashboard</h1>
<p>You are logged in as <strong sec:authentication="name">user@example.com</strong>.</p>
<p>This page is available to authenticated users.</p>
<div class="actions"><a class="button" th:href="@{/user/profile}">My profile</a><a class="button secondary" th:href="@{/admin}">Admin area</a><a class="button secondary" th:href="@{/employees}">Employee records</a></div>
<form th:action="@{/logout}" method="post"><button class="danger" type="submit">Logout</button></form>
<p class="muted">The admin and employee links are protected on the server. A USER role cannot access them.</p>
</main></body></html>
