<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Employees</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="card wide">
<h1>Employee Records</h1>
<p class="success" th:if="${message}" th:text="${message}"></p>
<div class="actions"><a class="button" th:href="@{/employees/new}">Add employee</a><a class="button secondary" th:href="@{/dashboard}">Dashboard</a></div>
<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Actions</th></tr></thead>
<tbody><tr th:each="employee : ${employees}">
<td th:text="${employee.id}"></td><td th:text="${employee.name}"></td><td th:text="${employee.email}"></td><td th:text="${employee.department}"></td>
<td class="actions"><a th:href="@{/employees/edit/{id}(id=${employee.id})}">Edit</a>
<form th:action="@{/employees/delete/{id}(id=${employee.id})}" method="post" onsubmit="return confirm('Delete this employee?')"><button class="danger small" type="submit">Delete</button></form></td>
</tr><tr th:if="${#lists.isEmpty(employees)}"><td colspan="5">No employees yet.</td></tr></tbody></table>
</main></body></html>
