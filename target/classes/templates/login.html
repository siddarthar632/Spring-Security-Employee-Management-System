<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="card">
<h1>Login</h1>
<p class="success" th:if="${param.registered}">Registration successful. Please log in.</p>
<p class="success" th:if="${param.logout}">You have logged out.</p>
<p class="error" th:if="${param.error}">Invalid email or password.</p>
<form th:action="@{/login}" method="post">
<label>Email</label><input type="email" name="username" required autocomplete="username">
<label>Password</label><input type="password" name="password" required autocomplete="current-password">
<button type="submit">Login</button>
</form>
<p>New user? <a th:href="@{/register}">Register here</a></p>
<p class="muted">Demo admin: admin@example.com / ChangeMe@123</p>
</main></body></html>
